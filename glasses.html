<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Meta Ray-Ban Display Web App requirements (see docs/meta-glasses.md) -->
  <meta name="description" content="yeet your thoughts — write it. burn it. let it go.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>yeet your thoughts</title>
  <link rel="icon" type="image/png" sizes="128x128" href="./assets/icon-128.png">
  <link rel="apple-touch-icon" href="./assets/icon-128.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/glasses.css">
</head>
<body data-mode="glasses" data-state="idle" data-platform="meta-webapp">

  <div class="viewport" id="viewport">
    <div class="app" id="app">
      <main class="stage" id="stage">
        <canvas class="embers" id="embers" aria-hidden="true"></canvas>

        <header class="top">
          <div class="brand">
            <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>yeet your thoughts</span>
          </div>
          <span class="pill">private by default</span>
        </header>

        <section class="hero entry">
          <p class="eyebrow">A 20-second reset</p>
          <h1 class="headline">What can leave for&nbsp;now?</h1>
          <p class="sub">Write it. Breathe once. Let it burn.</p>
        </section>

        <div class="field-labels entry">
          <span class="caps">One thought · no essay</span>
          <span class="cue">pinch to speak</span>
        </div>

        <div class="paper-wrap" id="paper-wrap">
          <!-- The text field is the focusable target. Pinching it opens Meta's composer
               (MetaInteractionAdapter clicks document.activeElement on Enter). -->
          <div class="paper" id="paper">
            <label class="sr-only" for="thought">your thought</label>
            <textarea id="thought" class="thought focusable" rows="1" maxlength="120"
              data-target="paper"
              placeholder="Pinch to speak or write"
              autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
              aria-label="your thought"></textarea>
            <span class="counter" id="counter" aria-hidden="true">0/120</span>
          </div>
          <canvas class="burn" id="burn" aria-hidden="true"></canvas>
        </div>

        <div class="actions entry">
          <button class="burn-btn focusable" id="burn-btn" type="button" data-target="burn" disabled>
            <span class="burn-btn__idle">hold this thought</span>
            <span class="burn-btn__ready">Burn This</span>
            <span class="burn-btn__arrow" aria-hidden="true">→</span>
          </button>
        </div>

        <div class="divider entry"><span>or keep it wordless</span></div>

        <div class="chips entry" id="chips" role="group" aria-label="quick thoughts">
          <button class="chip focusable" type="button" data-target="chip" data-preset="looping">looping</button>
          <button class="chip focusable" type="button" data-target="chip" data-preset="too much">too much</button>
          <button class="chip focusable" type="button" data-target="chip" data-preset="not mine">not mine</button>
          <button class="chip focusable" type="button" data-target="chip" data-preset="for later">for later</button>
        </div>

        <p class="footnote entry">Nothing is saved. Nothing is sent.</p>

        <p class="afterglow" id="afterglow" aria-live="polite"></p>
      </main>
    </div>
  </div>

  <script type="module" src="./src/main-glasses.js"></script>
</body>
</html>
